name: Hingeling
options:
  bundleIdPrefix: dev.jusso
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  PocketPetCore:
    path: ..
targets:
  Hingeling:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: PocketPetCore
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Hingeling
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsMultipleScenes: true
        NSLocalNetworkUsageDescription: Hingeling looks for other Hingeling pets nearby so they can play together. Only your pet's name, life stage and mood are shared.
        NSBonjourServices:
          - _hingeling._tcp
          - _hingeling._udp
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jusso.hingeling
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
  HingelingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Hingeling
      - package: PocketPetCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  HingelingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Hingeling
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Hingeling
schemes:
  Hingeling:
    build:
      targets:
        Hingeling: all
        HingelingTests: [test]
        HingelingUITests: [test]
    test:
      targets:
        - HingelingTests
        - HingelingUITests
