name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Core tests and app build (xcode-27 image, hosted)
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      # The iPhone Duo hinge APIs (DeviceHinge, onHingeChange) ship in the iOS 27.1 SDK.
      MIN_SIM_SDK: "27.1"
    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest Xcode with the iPhone Duo SDK
        run: |
          set -euo pipefail
          echo "Xcodes on this image:"
          ls -d /Applications/Xcode*.app || true
          chosen=""
          # Released builds first (newest first), then betas and release candidates.
          all=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -t_ -k2 -V -r)
          for app in $(echo "$all" | grep -viE 'beta|candidate') $(echo "$all" | grep -iE 'beta|candidate'); do
            [ -L "$app" ] && continue
            sdk=$(DEVELOPER_DIR="$app/Contents/Developer" xcrun --sdk iphonesimulator --show-sdk-version 2>/dev/null || echo 0)
            echo "$app -> iphonesimulator SDK $sdk"
            if [ "$(printf '%s\n%s\n' "$MIN_SIM_SDK" "$sdk" | sort -V | head -n1)" = "$MIN_SIM_SDK" ]; then
              chosen="$app"; break
            fi
          done
          if [ -z "$chosen" ]; then
            echo "::error::No Xcode on the xcode-27 image has iphonesimulator SDK $MIN_SIM_SDK or later, so the iPhone Duo APIs are not available on this image yet."
            exit 1
          fi
          sudo xcode-select -s "$chosen/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Core package tests (swift test)
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: App
        run: xcodegen generate

      - name: Create an iOS 27.1 simulator
        id: sim
        run: |
          set -euo pipefail
          echo "== Runtimes"; xcrun simctl list runtimes
          echo "== Device types"; xcrun simctl list devicetypes
          pick_runtime='
          import json, os, sys
          want = [int(x) for x in os.environ["MIN_SIM_SDK"].split(".")]
          rts = [r for r in json.load(sys.stdin)["runtimes"] if r.get("platform") == "iOS" and r.get("isAvailable")]
          rts = [r for r in rts if [int(x) for x in r["version"].split(".")][:2] >= want]
          rts.sort(key=lambda r: [int(x) for x in r["version"].split(".")])
          print(rts[0]["identifier"] if rts else "")
          '
          runtime=$(xcrun simctl list runtimes -j | python3 -c "$pick_runtime")
          if [ -z "$runtime" ]; then
            echo "No iOS $MIN_SIM_SDK+ simulator runtime is installed, so downloading the one that matches the selected Xcode."
            xcodebuild -downloadPlatform iOS
            xcrun simctl list runtimes
            runtime=$(xcrun simctl list runtimes -j | python3 -c "$pick_runtime")
          fi
          if [ -z "$runtime" ]; then
            echo "::error::No iOS simulator runtime at $MIN_SIM_SDK or later is available, even after downloading."
            exit 1
          fi
          # Try the iPhone Duo first. If simctl refuses it on this runtime, fall back to the newest standard iPhone.
          candidates=$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          types = [t for t in json.load(sys.stdin)["devicetypes"] if t["name"].startswith("iPhone")]
          duo = [t for t in types if "Duo" in t["name"]]
          rest = [t for t in types if "Duo" not in t["name"]]
          for t in duo + rest[:1]:
              print(t["identifier"] + "|" + t["name"])
          ')
          udid=""
          while IFS="|" read -r dtype dname; do
            [ -z "$dtype" ] && continue
            if udid=$(xcrun simctl create "CI $dname" "$dtype" "$runtime" 2>create.err); then
              break
            fi
            echo "::warning::Could not create a $dname simulator on $runtime: $(tr '\n' ' ' < create.err)"
            udid=""
          done <<< "$candidates"
          if [ -z "$udid" ]; then
            echo "::error::Could not create any iPhone simulator on $runtime."
            exit 1
          fi
          if [[ "$dname" == *Duo* ]]; then kind="iPhone Duo"; else kind="standard iPhone (iPhone Duo simulator not available here)"; fi
          echo "::notice::Simulator: $dname on $runtime. Device kind: $kind"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build and test the app on the simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project App/Hingeling.xcodeproj \
            -scheme Hingeling \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Hingeling.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            build test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hingeling-xcresult
          path: build/Hingeling.xcresult
          if-no-files-found: ignore
